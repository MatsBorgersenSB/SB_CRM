services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartcrm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartcrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartcrm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/smartcrm?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/smartcrm?schema=public}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TOKEN_ENCRYPTION_SECRET: ${TOKEN_ENCRYPTION_SECRET:-change-me-in-production}
      CRON_SECRET: ${CRON_SECRET:-}
      INTERNAL_DOMAINS: ${INTERNAL_DOMAINS:-standard.bio,standardbio.com,standardbio.no}
      SHAREPOINT_TRANSPORT: ${SHAREPOINT_TRANSPORT:-local}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      M365_OAUTH_SCOPES: ${M365_OAUTH_SCOPES:-openid profile offline_access Mail.Read Mail.Send Calendars.Read User.Read}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smartcrm_postgres_data:
