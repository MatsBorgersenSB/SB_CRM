name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint-free build checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Prisma generate / Next build do not require a live DB; placeholder URL is enough.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartcrm?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartcrm?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      TOKEN_ENCRYPTION_SECRET: ci-placeholder-token-encryption-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E smoke tests
        run: npx playwright test
        env:
          CI: "true"
          E2E: "1"
          # Soft health + JSON portfolio fallbacks — no live DB required for smoke.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartcrm?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartcrm?schema=public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
